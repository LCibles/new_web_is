<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>New Web | Menú</title>
</head>
<body data-vista="inicio">
    <!-- Encabezado de la pantalla inicial; se oculta al abrir el catálogo. -->
    <header class="cabecera-principal">
        <div class="cuadrogrande">
            <h1>Welcome Miguel Sanchez</h1>
        </div>
    </header>

    <main>
        <!-- Pantalla 1: menú de categorías. -->
        <section class="ocul" aria-label="Menú principal">
            <div class="trans">
                <div class="sombreado">
                    <h2 class="sentence">Hola, ¿qué deseas?</h2>
                    <button class="uno" type="button">Cafés</button>
                    <button class="dos" type="button">Bebidas</button>
                    <button class="tres" type="button">Acompañamientos</button>
                </div>
            </div>
        </section>

        <!-- Pantalla 2: carrusel circular con tarjetas vecinas visibles. -->
        <section class="menu_coffe" aria-label="Catálogo de cafés" hidden>
            <div class="carrusel-cafes" tabindex="0" aria-roledescription="carrusel" aria-label="Productos de café; desliza horizontalmente o utiliza las flechas">
                <div class="pista-cafes">
                    <article class="cuadro" aria-label="Producto 1 de 3: Capuchino">
                        <img src="cafe_web.png" alt="Taza de café" class="imagen" draggable="false">
                        <div class="letras">
                            <p class="perte">Café con leche</p>
                            <h2 class="tipo">Capuchino</h2>
                            <p>Espresso y leche vaporizada, con una suave capa de espuma.</p>
                        </div>
                    </article>
                    <article class="cuadro" aria-label="Producto 2 de 3: Espresso">
                        <img src="cafe_web.png" alt="Imagen ilustrativa de café" class="imagen" draggable="false">
                        <div class="letras">
                            <p class="perte">Café solo</p>
                            <h2 class="tipo">Espresso</h2>
                            <p>Café concentrado de sabor intenso y aroma profundo.</p>
                        </div>
                    </article>
                    <article class="cuadro" aria-label="Producto 3 de 3: Latte">
                        <img src="cafe_web.png" alt="Imagen ilustrativa de café" class="imagen" draggable="false">
                        <div class="letras">
                            <p class="perte">Café con leche</p>
                            <h2 class="tipo">Latte</h2>
                            <p>Espresso con leche vaporizada y textura cremosa.</p>
                        </div>
                    </article>
                </div>
            </div>
            <div class="controles-cafes" aria-label="Controles del carrusel">
                <button class="cafe-anterior" type="button" aria-label="Producto anterior">←</button>
                <output class="cafe-indicador" aria-live="polite">01 / 03</output>
                <button class="cafe-siguiente" type="button" aria-label="Producto siguiente">→</button>
            </div>
            <button class="volver" type="button">Volver al menú</button>
        </section>
    </main>
</body>
</html>
