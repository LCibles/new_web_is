<!DOCTYPE html>
<html lang="es" >
<head>
    <!-- 1. Configuración general del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>pag one</title>
</head>
<body>
    <!-- 2. Encabezado: título superior de la página -->
    <header>
        <div class="cuadrogrande">
            <h1>Welcome Miguel Sanchez </h1>
        </div>
    </header>

    <!-- 3. Contenido principal: estructura de la sección central -->
    <main>
        <section>
            <!-- 3.1. .trans: contenedor exterior que alinea el recuadro -->
            <div class="trans">
                <!-- 3.2. .sombreado: borde redondeado, sombra y disposición vertical -->
                <div class="sombreado">
                    <!-- 3.3. .sentence: texto con animación de escritura.
                         Se usa h2 en vez de un div dentro de h1 para un HTML válido. -->
                    <h2 class="sentence">Hola, que deceas</h2>

                    <!-- 3.4. Opciones: Flexbox ya las dispone en columna;
                         no hacen falta saltos de línea <br>. -->
                    <span class="uno">Caffes</span>
                    <span class="dos">Bebidas</span>
                    <span class="tres">Acompañamientos</span>
                </div>
            </div>
        </section>
    </main>
</body>
